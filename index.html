function freshGame(){return{
coins:500,inventory:{},packsOpened:0,kills:0,coinsEarned:0,wave:1,highestWave:1,
health:100,damage:10,zombies:5,seasonXP:0,seasonClaimed:[],dailyDate:"",
upgrades:{damage:0,health:0},recent:[],ttCandy:0,ttVisited:[],ttX:3,ttY:6
};}

let game=freshGame();

function el(id){return document.getElementById(id);}
function readStore(key,fallback){
try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch(e){return fallback}
}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(game))}catch(e){}}
function loadGame(){
const saved=readStore(SAVE_KEY,null);
if(saved&&typeof saved==="object")game={...freshGame(),...saved,upgrades:{...freshGame().upgrades,...(saved.upgrades||{})}};
}
function fmt(n){return Math.floor(n).toLocaleString();}
function toast(msg){
el("toast").textContent=msg;el("toast").classList.add("show");
clearTimeout(window.toastTimer);
window.toastTimer=setTimeout(()=>el("toast").classList.remove("show"),2600);
}
function go(page){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
if(el(page))el(page).classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
window.scrollTo({top:0,behavior:"smooth"});
}
el("nav").addEventListener("click",e=>{
const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page);
});
function addCoins(n){game.coins+=n;if(n>0)game.coinsEarned+=n;}
function addXP(n){game.seasonXP=Math.min(1000,game.seasonXP+n);}
function ownedKey(id,v){return id+"_"+v;}
function getOwned(id,v){return game.inventory[ownedKey(id,v)]||0;}
function totalRelics(){return Object.values(game.inventory).reduce((a,b)=>a+b,0);}
function totalGold(){return Object.entries(game.inventory).filter(([k])=>k.endsWith("_gold")).reduce((a,[k,v])=>a+v,0);}
function totalCandy(){return Object.entries(game.inventory).filter(([k])=>k.endsWith("_candy")).reduce((a,[k,v])=>a+v,0);}
function addRelic(r,v="normal"){
const k=ownedKey(r.id,v);game.inventory[k]=(game.inventory[k]||0)+1;
game.recent.unshift({id:r.id,variant:v,time:Date.now()});game.recent=game.recent.slice(0,10);
}
function rarityRoll(w){
let n=Math.random()*w.reduce((a,b)=>a+b,0);
for(let i=0;i<w.length;i++){n-=w[i];if(n<0)return RARITIES[i]}
return "Common";
}
function openPack(id){
const p=PACKS.find(x=>x.id===id);if(!p)return;
if(game.coins<p.price){toast("Not enough coins!");return}
game.coins-=p.price;
const rarity=rarityRoll(p.weights),choices=RELICS.filter(r=>r.rarity===rarity);
const r=choices[Math.floor(Math.random()*choices.length)];
const n=Math.random()*100,v=n<1.5?"candy":n<6.5?"gold":"normal";
addRelic(r,v);game.packsOpened++;addXP(25);saveGame();updateAll();showReveal(r,v);
}
function showReveal(r,v){
el("revealCard").className="reveal"+(v==="gold"?" gold-reveal":v==="candy"?" candy-relic":"");
el("revealTag").textContent=v==="gold"?"✨ GOLD RELIC":v==="candy"?"🍬 CANDY CORN RELIC":r.rarity.toUpperCase()+" RELIC";
el("revealIcon").textContent=(v==="gold"?"✨ ":v==="candy"?"🍬 ":"")+r.icon;
el("revealName").textContent=(v==="gold"?"Gold ":v==="candy"?"Candy Corn ":"")+r.name;
el("revealRarity").textContent=r.rarity+(v!=="normal"?" • SPECIAL VARIANT":"");
el("revealDescription").textContent=r.description;
el("revealOwned").textContent="Owned: "+getOwned(r.id,v);
el("revealXP").textContent="⭐ +25 Season XP";
el("revealOverlay").classList.add("show");
}
function closeReveal(){el("revealOverlay").classList.remove("show");}

function renderPacks(){
const card=p=>`<div class="card pack-card"><div class="pack-icon">${p.icon}</div><h3>${p.name}</h3><p>${p.description}</p><div class="price">🪙 ${fmt(p.price)}</div><div class="small muted">Common ${p.weights[0]}% • Rare ${p.weights[1]}% • Epic ${p.weights[2]}% • Legendary ${p.weights[3]}%</div><button class="btn full" onclick="openPack('${p.id}')">Open Pack</button></div>`;
el("packsGrid").innerHTML=PACKS.map(card).join("");
el("featuredPacks").innerHTML=PACKS.slice(0,4).map(card).join("");
}
function relicValue(id,v){
const r=RELICS.find(x=>x.id===id);return r?Math.floor(r.value*(v==="gold"?2:v==="candy"?3.5:1)):0;
}
function renderRelics(){
const f=el("relicFilter").value,list=[];
RELICS.forEach(r=>["normal","gold","candy"].forEach(v=>{
const count=getOwned(r.id,v);if(!count)return;
if(f!=="all"&&f!==v)return;list.push({r,v,count});
}));
el("relicsGrid").innerHTML=list.length?list.map(({r,v,count})=>`<div class="card ${v==="gold"?"gold-relic":v==="candy"?"candy-relic":""}"><div class="relic-icon">${v==="gold"?"✨":v==="candy"?"🍬":""}${r.icon}</div><h3>${v==="gold"?"Gold ":v==="candy"?"Candy Corn ":""}${r.name}</h3><span class="tag">${r.rarity}</span><p>${r.description}</p><div class="owned">Owned: ${count}</div><p>Sell value: 🪙 ${fmt(relicValue(r.id,v))}</p></div>`).join(""):'<div class="card">No relics here yet. Open some packs!</div>';
}
function renderMarket(){
const items=[];
RELICS.forEach(r=>["normal","gold","candy"].forEach(v=>{const count=getOwned(r.id,v);if(count)items.push({r,v,count})}));
el("marketGrid").innerHTML=items.length?items.map(({r,v,count})=>`<div class="card"><div class="relic-icon">${r.icon}</div><h3>${v==="gold"?"✨ Gold ":v==="candy"?"🍬 Candy Corn ":""}${r.name}</h3><p>Owned: ${count}</p><p>Each: 🪙 ${relicValue(r.id,v)}</p><button class="btn" onclick="sellRelic('${r.id}','${v}')">Sell One</button><button class="btn secondary" onclick="sellAll('${r.id}','${v}')">Sell All (${count})</button></div>`).join(""):'<div class="card">Open packs to find relics to sell!</div>';
}
function sellRelic(id,v){
const k=ownedKey(id,v);if(!game.inventory[k])return;
game.inventory[k]--;if(!game.inventory[k])delete game.inventory[k];
addCoins(relicValue(id,v));saveGame();updateAll();toast("Relic sold!");
}
function sellAll(id,v){
const k=ownedKey(id,v),n=game.inventory[k]||0;if(!n)return;
addCoins(relicValue(id,v)*n);delete game.inventory[k];saveGame();updateAll();toast("Sold "+n+" relics!");
}
function daily(){
const today=new Date().toDateString();
if(game.dailyDate===today){toast("Daily reward already claimed!");return}
game.dailyDate=today;addCoins(150);addXP(50);saveGame();updateAll();toast("Daily reward: 150 coins and 50 Season XP!");
}
function attack(){
if(game.health<=0){el("battleLog").textContent="You are out of health! Heal before fighting again.";return}
if(game.zombies<=0){toast("Wave cleared! Start the next wave.");return}
game.zombies--;game.kills++;addCoins(20+game.wave*5);addXP(20);
game.health=Math.max(0,game.health-Math.max(3,Math.floor(game.wave*2)));
el("battleLog").textContent=game.zombies===0?"Wave cleared! Bonus coins and XP awarded.":"You dealt "+game.damage+" damage and defeated a zombie! ("+game.zombies+" left)";
if(game.zombies===0){addCoins(50);addXP(40)}
if(game.health===0)el("battleLog").textContent+=" You ran out of health. Heal to continue.";
saveGame();updateAll();
}
function heal(){
if(game.coins<70){toast("Not enough coins!");return}
if(game.health>=100+game.upgrades.health*20){toast("Your health is already full!");return}
game.coins-=70;game.health=Math.min(100+game.upgrades.health*20,game.health+40);saveGame();updateAll();toast("Health restored!");
}
function nextWave(){
if(game.zombies>0){toast("Defeat all zombies first!");return}
game.wave++;game.highestWave=Math.max(game.highestWave,game.wave);game.zombies=5+game.wave;
game.health=Math.min(100+game.upgrades.health*20,game.health+25);saveGame();updateAll();toast("Wave "+game.wave+" started!");
}
function renderShop(){
const a=[
{id:"damage",name:"⚔️ Stronger Weapon",description:"+5 damage per upgrade.",price:100+game.upgrades.damage*100},
{id:"health",name:"❤️ Health Boost",description:"+20 maximum health.",price:100+game.upgrades.health*100}
];
el("shopGrid").innerHTML=a.map(u=>`<div class="card"><h3>${u.name}</h3><p>${u.description}</p><p>Level: ${game.upgrades[u.id]}</p><div class="price">🪙 ${u.price}</div><button class="btn full" onclick="buyUpgrade('${u.id}',${u.price})">Buy Upgrade</button></div>`).join("");
}
function buyUpgrade(id,price){
if(game.coins<price){toast("Not enough coins!");return}
game.coins-=price;game.upgrades[id]++;
if(id==="damage")game.damage+=5;if(id==="health")game.health+=20;
saveGame();updateAll();toast("Upgrade purchased!");
}
function claimSeason(){
let count=0;
for(let i=0;i<SEASON_REWARDS.length;i++){
if(game.seasonXP<(i+1)*100)break;if(game.seasonClaimed.includes(i))continue;
const r=SEASON_REWARDS[i];
if(r.type==="coins")addCoins(r.amount);
if(r.type==="pack"){const p=PACKS.find(x=>x.id===r.pack);if(p)addRelic(RELICS[Math.floor(Math.random()*RELICS.length)]);}
if(r.type==="relic"){const rel=RELICS.find(x=>x.id===r.relic);if(rel)addRelic(rel);}
game.seasonClaimed.push(i);count++;
}
saveGame();updateAll();toast(count?"Claimed "+count+" reward(s)!":"No new rewards unlocked yet!");
}
function renderSeason(){
const level=Math.min(10,Math.floor(game.seasonXP/100)+1);
el("seasonLevel").textContent=level;el("seasonXP").textContent=game.seasonXP;
el("seasonBar").style.width=(game.seasonXP%100)+"%";
el("claimStatus").textContent=game.seasonClaimed.length+" / 10 rewards claimed";
el("seasonTrack").innerHTML=SEASON_REWARDS.map((r,i)=>{
const u=game.seasonXP>=(i+1)*100,c=game.seasonClaimed.includes(i);
return `<div class="tier ${c?"claimed":u?"":"locked"}"><div class="muted small">TIER ${i+1}</div><div style="font-size:34px">${r.icon}</div><b>${r.name}</b><p>${(i+1)*100} XP</p><span class="owned">${c?"✓ Claimed":u?"Unlocked":"Locked"}</span></div>`;
}).join("");
}
function renderRecords(){
const rows=[["Packs opened",game.packsOpened],["Coins earned",game.coinsEarned],["Zombies defeated",game.kills],["Highest wave",game.highestWave],["Season XP",game.seasonXP],["Total relics",totalRelics()]];
el("recordsGrid").innerHTML=rows.map(([n,v])=>`<div class="card"><p>${n}</p><h2>${fmt(v)}</h2></div>`).join("");
el("recentDiscoveries").innerHTML=game.recent.length?game.recent.map(d=>{const r=RELICS.find(x=>x.id===d.id);return r?`<div class="record"><span>${r.icon} ${d.variant==="gold"?"Gold ":d.variant==="candy"?"Candy Corn ":""}${r.name}</span><span>${r.rarity}</span></div>`:""}).join(""):'<p>No discoveries yet. Open your first pack!</p>';
}
function renderAchievements(){
const a=[
["🎁 Pack Collector","Open 10 packs",game.packsOpened>=10,game.packsOpened+"/10"],
["💎 Relic Hunter","Collect 10 relics",totalRelics()>=10,totalRelics()+"/10"],
["✨ Golden Touch","Find a Gold relic",totalGold()>0,totalGold()+" gold"],
["🍬 Sweet Surprise","Find a Candy Corn relic",totalCandy()>0,totalCandy()+" candy"],
["🧟 Zombie Slayer","Defeat 10 zombies",game.kills>=10,game.kills+"/10"],
["🌊 Survivor","Reach wave 5",game.highestWave>=5,game.highestWave+"/5"],
["🌌 Season Explorer","Earn 500 Season XP",game.seasonXP>=500,game.seasonXP+"/500"]
];
el("achievementsGrid").innerHTML=a.map(([n,d,done,p])=>`<div class="card" style="border-color:${done?"#52e0a0":"var(--border)"}"><h3>${done?"✅ ":"🔒 "}${n}</h3><p>${d}</p><div class="owned">${done?"Completed":"In progress"} • ${p}</div></div>`).join("");
}

const TT_HOUSES=[{x:1,y:1},{x:5,y:1},{x:3,y:2},{x:0,y:4},{x:6,y:4}];
function renderTT(){
el("ttCandy").textContent=game.ttCandy;el("ttVisited").textContent=game.ttVisited.length;
let html="";
for(let y=0;y<7;y++)for(let x=0;x<7;x++){
let cls="path",icon="🟫";const h=TT_HOUSES.findIndex(a=>a.x===x&&a.y===y);
if(h>=0){cls="house";icon=game.ttVisited.includes(h)?"🏚️":"🏠"}
if(x===game.ttX&&y===game.ttY){cls="player";icon="🧍"}
html+=`<button class="tt-tile ${cls}" onclick="ttGoTo(${x},${y})">${icon}</button>`;
}
el("ttMap").innerHTML=html;
}
function ttMove(dx,dy){
game.ttX=Math.max(0,Math.min(6,game.ttX+dx));game.ttY=Math.max(0,Math.min(6,game.ttY+dy));renderTT();saveGame();
}
function ttGoTo(x,y){
if(Math.abs(x-game.ttX)+Math.abs(y-game.ttY)>1){toast("Move one tile at a time!");return}
game.ttX=x;game.ttY=y;renderTT();saveGame();
}
function ttKnock(){
const i=TT_HOUSES.findIndex(h=>Math.abs(h.x-game.ttX)+Math.abs(h.y-game.ttY)<=1);
if(i<0){el("ttMessage").textContent="Move next to a house first!";return}
if(game.ttVisited.includes(i)){el("ttMessage").textContent="You already visited this house!";return}
game.ttVisited.push(i);const candy=5+Math.floor(Math.random()*16);
game.ttCandy+=candy;addCoins(25);addXP(10);
el("ttMessage").textContent="🎃 You received "+candy+" candy and 25 coins!";
el("ttSurprise").textContent=["A friendly ghost gave you candy!","A mysterious witch shared her sweets!","A pumpkin spirit appeared!","You found a spooky treasure!"][Math.floor(Math.random()*4)];
if(game.ttVisited.length===5){game.ttCandy+=50;addCoins(200);el("ttMessage").textContent+=" Bonus: 50 candy and 200 coins!"}
saveGame();updateAll();
}

/* SECURE SERVER-VERIFIED ADMIN LOGIN */
let adminToken=null;
let adminExpiry=0;
let generatedGiveawayCode="";

function openAdmin(){
el("adminPanel").style.display="block";
}
function closeAdmin(){
el("adminPanel").style.display="none";
}
function adminStatus(msg){
el("adminStatus").textContent=msg;
}
async function readJsonResponse(res){
const text=await res.text();
try{return JSON.parse(text);}
catch{
throw new Error("The server did not return JSON. Check that your Netlify Function is deployed.");
}
}
async function adminRequest(action,extra={}){
if(!adminToken||Date.now()>=adminExpiry){
adminLogout();
throw new Error("Your admin session expired. Please log in again.");
}
const res=await fetch("/.netlify/functions/admin",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+adminToken
},
body:JSON.stringify({action,...extra})
});
const data=await readJsonResponse(res);
if(!res.ok)throw new Error(data.error||"Admin request rejected.");
return data;
}
async function adminLogin(){
const code=el("adminPassword").value.trim();
if(!code){adminStatus("Enter your admin code.");return;}
const btn=document.querySelector('#adminLogin button');
btn.disabled=true;
btn.textContent="Checking…";
try{
const res=await fetch("/.netlify/functions/admin",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({action:"login",code})
});
const data=await readJsonResponse(res);
if(!res.ok||!data.token)throw new Error(data.error||"Login rejected.");
adminToken=data.token;
adminExpiry=Number(data.expiresAt)||Date.now()+15*60*1000;
el("adminLogin").style.display="none";
el("adminTools").style.display="block";
el("adminPassword").value="";
el("adminRelic").innerHTML=RELICS.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
adminStatus("Server verified your admin login.");
renderAdminCodes();
}catch(err){
adminStatus(err.message||"Could not verify your login.");
}finally{
btn.disabled=false;
btn.textContent="Login";
}
}
function adminLogout(){
adminToken=null;
adminExpiry=0;
el("adminLogin").style.display="block";
el("adminTools").style.display="none";
adminStatus("Logged out.");
}
function checkAdmin(){
if(!adminToken||Date.now()>=adminExpiry){
adminStatus("Please log in through the server first.");
return false;
}
return true;
}

const n=Number(el("adminCoins").value);
if(!Number.isInteger(n)||n<1||n>1000000){
adminStatus("Enter 1–1,000,000 coins.");
return;
}
try{
const data=await adminRequest("giveCoins",{amount:n});
adminStatus(data.message||"Server accepted the coin command.");
}catch(e){adminStatus(e.message);}
}

function makeCodeString(){
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let s="RR-";
for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];
return s;
}

async function renderAdminCodes(){
if(!checkAdmin())return;
try{
const data=await adminRequest("listRewardCodes");
const codes=data.codes||[];
el("adminCodeList").innerHTML=codes.length?codes.map(d=>
`<div class="record"><div><b>${d.code||"Code"}</b><br><span class="small muted">${prizeLabel(d.prize)}</span></div><span>${d.used?"✅ Used":"🟢 Available"}</span></div>`
).join(""):"<p>No server codes returned.</p>";
}catch(e){
el("adminCodeList").innerHTML="<p>Could not load server codes.</p>";
adminStatus(e.message);
}
}
function prizeLabel(p){
return ({
coins:"1,000 Coins",
coins5000:"5,000 Coins",
starter:"Starter Pack Prize",
cosmic:"Cosmic Pack Prize",
gold:"Random Gold Relic",
candy:"Random Candy Corn Relic",
legendary:"Random Legendary Relic"
})[p]||"Reward";
}
async function redeemPlayerCode(){
const input=el("playerRedeemCode");
const code=input.value.trim().toUpperCase();
if(!code){toast("Enter a code first!");return;}
try{
const res=await fetch("/.netlify/functions/redeem",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({code})
});
const data=await readJsonResponse(res);
if(!res.ok)throw new Error(data.error||"Code could not be redeemed.");
if(data.coins)addCoins(Number(data.coins));
if(data.relic&&data.relic.id){
const r=RELICS.find(x=>x.id===data.relic.id);
if(r)addRelic(r,data.relic.variant||"normal");
}
if(data.reward){
if(data.reward.type==="coins")addCoins(Number(data.reward.amount)||0);
if(data.reward.type==="relic"){
const r=RELICS.find(x=>x.id===data.reward.relicId);
if(r)addRelic(r,data.reward.variant||"normal");
}
}
input.value="";
saveGame();
updateAll();
toast(data.message||"🎉 Code redeemed!");
}catch(e){
toast(e.message||"Redemption failed.");
}
}
function redeemCode(){
adminStatus("Redeem codes using the player redeem box.");
}
function updateAll(){

el("totalRelics").textContent=fmt(totalRelics());
el("waveStat").textContent=game.wave;
el("levelStat").textContent=Math.floor(game.seasonXP/100)+1;
el("collectionValue").textContent=fmt(Object.entries(game.inventory).reduce((s,[k,v])=>s+relicValue(k.replace(/_(normal|gold|candy)$/,""),k.endsWith("_gold")?"gold":k.endsWith("_candy")?"candy":"normal")*v,0))+" 🪙";
el("uniqueCount").textContent=Object.keys(game.inventory).filter(k=>game.inventory[k]>0).length;
el("goldCount").textContent=totalGold();
el("candyCount").textContent=totalCandy();

game=freshGame();saveGame();updateAll();go("home");toast("Progress reset.");
}
